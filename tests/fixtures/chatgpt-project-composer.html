<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Project composer fixture</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; color: #202123; background: #f7f7f8; }
    body { margin: 0; padding: 32px; }
    main { max-width: 820px; margin: 0 auto; }
    .topbar, .mode-picker, .composer-actions { display: flex; align-items: center; gap: 10px; }
    .topbar { justify-content: space-between; margin-bottom: 36px; }
    .mode-picker { margin-bottom: 24px; }
    button { min-height: 40px; padding: 7px 13px; border: 1px solid #d9d9e3; border-radius: 10px; background: white; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #777; background: #ececf1; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { margin: 0 0 28px; color: #6e6e80; }
    form[data-chatgpt-composer] { padding: 12px; border: 1px solid #c9c9d3; border-radius: 18px; background: white; box-shadow: 0 4px 18px #0000000d; }
    [data-composer-input] { min-height: 56px; padding: 8px 10px; }
    [data-composer-markdown] { min-height: 40px; max-height: 220px; overflow: auto; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; }
    [data-empty-paragraph] { margin: 0; }
    [data-placeholder] { color: #8e8ea0; }
    .composer-actions { justify-content: space-between; margin-top: 12px; }
    .action-group { display: flex; gap: 8px; }
    .secondary { margin-top: 52px; padding-top: 22px; border-top: 1px solid #dddde4; }
    .secondary textarea { display: block; width: min(100%, 520px); min-height: 70px; margin-top: 8px; padding: 10px; font: inherit; }
    #fixture-log { margin-top: 24px; color: #6e6e80; font: 13px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <strong>Fixture Project</strong>
    </div>
    <div class="mode-picker" aria-label="Product mode">
      <button type="button" aria-pressed="true">Chat</button>
      <button type="button" aria-pressed="false">Work</button>
    </div>
    <h1>Fixture Project</h1>
    <p class="subtitle">A local page for checking prompt handoff behavior.</p>

    <form data-chatgpt-composer="" data-composer-placement="home" data-thread-find-composer="true">
      <div data-composer-body>
        <div data-composer-input>
          <div class="ProseMirror" contenteditable="true" role="textbox" aria-multiline="true" data-composer-markdown="" data-virtualkeyboard="true" aria-label="New chat in Fixture Project" dir="auto" spellcheck="true" tabindex="0" translate="no">
            <p data-empty-paragraph="true" data-placeholder="New chat in Fixture Project"><br></p>
          </div>
        </div>
        <div data-composer-attachments hidden></div>
      </div>
      <div class="composer-actions">
        <button type="button" aria-label="Select ChatGPT model" data-codex-intelligence-trigger="true">Pro</button>
        <div class="action-group">
          <button type="button" aria-label="Dictate">Dictate</button>
          <button type="button" aria-label="Start Voice">Start Voice</button>
        </div>
      </div>
    </form>

    <section class="secondary">
      <label for="unrelated-draft">Unrelated editor (must remain untouched)</label>
      <textarea id="unrelated-draft" placeholder="This editor is outside the ChatGPT composer."></textarea>
    </section>
    <pre id="fixture-log" aria-live="polite">Fixture ready.</pre>
  </main>

  <script>
    (() => {
      const payload = 'Fixture YouTube prompt';
      const destinationUrl = 'https://chatgpt.com/g/g-p-fixture-project/project';
      window.fixtureState = {
        getCount: 0,
        claimCount: 0,
        clearCount: 0,
        buttonClicks: [],
        payloadAvailable: true,
        messages: []
      };

      const log = (entry) => {
        window.fixtureState.messages.push(entry);
        document.querySelector('#fixture-log').textContent = JSON.stringify(window.fixtureState, null, 2);
        if (typeof window.onFixtureMessage === 'function') window.onFixtureMessage(entry);
      };

      window.chrome = window.chrome || {};
      window.chrome.runtime = window.chrome.runtime || {};
      window.chrome.runtime.sendMessage = async (message) => {
        const type = message && message.type;
        let response;
        if (type === 'GET_PENDING_PAYLOAD') {
          window.fixtureState.getCount += 1;
          response = { ok: true, payload: window.fixtureState.payloadAvailable ? payload : null, destinationUrl };
        } else if (type === 'CLAIM_PENDING_PAYLOAD') {
          window.fixtureState.claimCount += 1;
          const available = window.fixtureState.payloadAvailable;
          window.fixtureState.payloadAvailable = false;
          response = { ok: true, payload: available ? payload : null, destinationUrl };
        } else if (type === 'CLEAR_PENDING_PAYLOAD') {
          window.fixtureState.clearCount += 1;
          window.fixtureState.payloadAvailable = false;
          response = { ok: true };
        } else {
          response = { ok: false, error: 'Unknown fixture message.' };
        }
        log({ type, response });
        return response;
      };

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const label = button.getAttribute('aria-label') || button.textContent.trim();
        window.fixtureState.buttonClicks.push(label);
        log({ buttonClick: label });
      });
    })();
  </script>
</body>
</html>
